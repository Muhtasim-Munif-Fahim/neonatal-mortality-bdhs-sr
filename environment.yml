# Optional conda alternative to the venv + requirements.txt workflow.
#   conda env create -f environment.yml
#   conda activate neonatal-bdhs
name: neonatal-bdhs
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.4.6
      - pandas==3.0.3
      - pyarrow==24.0.0
      - pyreadstat==1.3.2
      - scikit-learn==1.5.2
      - imbalanced-learn==0.12.3
      - xgboost==2.1.3
      - catboost==1.2.8
      - Boruta==0.4.3
      - shap==0.49.1
      - matplotlib==3.10.3
      - seaborn==0.13.2
      - scipy==1.15.3
      - joblib==1.5.2
